<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" preserveAspectRatio="none">
<defs><linearGradient id="dv" x1="0" x2="1"><stop offset="0" stop-color="#36BCF7" stop-opacity="0"/><stop offset=".5" stop-color="#36BCF7"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient></defs>
<style>.m{animation:mv 4.5s cubic-bezier(.45,0,.55,1) infinite}@keyframes mv{0%{transform:translateX(-420px)}100%{transform:translateX(1200px)}}
.p{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect y="6.5" width="1200" height="1" fill="#36BCF7" fill-opacity=".22"/>
<rect class="m" y="6" width="420" height="2" rx="1" fill="url(#dv)"/>
<circle class="p" cx="600" cy="7" r="3" fill="#36BCF7"/><circle cx="584" cy="7" r="2" fill="#A78BFA"/><circle cx="616" cy="7" r="2" fill="#A78BFA"/>
</svg>
