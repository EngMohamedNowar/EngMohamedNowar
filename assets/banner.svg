<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340">
<style>
  .t{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  .r{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;font-size:20px;font-weight:600;fill:#36BCF7;opacity:0;animation:rot 12s infinite}
  .st{animation:slide .7s cubic-bezier(.2,.7,.2,1) both}
  .pb{fill:#161B22;stroke:#36BCF7;stroke-opacity:.35;stroke-width:1.2;animation:hl 3.3s ease-in-out infinite}
  .fl{stroke:#36BCF7;stroke-width:1.5;stroke-dasharray:4 5;stroke-opacity:.7;animation:flow 1.2s linear infinite}
  .rv{stroke:#4ADE80;stroke-opacity:.45;animation-direction:reverse}
  .pt{fill:#36BCF7;opacity:0;animation:drift 10s linear infinite}
  .orb{animation:orb 12s ease-in-out infinite;transform-origin:center}
  .orb2{animation:orb 15s ease-in-out infinite reverse}
  .cur{animation:blink 1s steps(1) infinite}
  .sc{animation:scan 6s linear infinite}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes rot{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-10px)}}
  @keyframes hl{0%,100%{stroke-opacity:.3}15%{stroke-opacity:1;fill:#12283A}30%{stroke-opacity:.3}}
  @keyframes flow{to{stroke-dashoffset:-18}}
  @keyframes drift{0%{opacity:0;transform:translateY(0)}20%{opacity:.7}80%{opacity:.5}100%{opacity:0;transform:translateY(-60px)}}
  @keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,25px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1580px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.r0{opacity:1}}
</style>
<defs>
  <linearGradient id="nbBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#0B1B2B"/></linearGradient>
  <pattern id="nbGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
  <radialGradient id="nbOrbA"><stop offset="0" stop-color="#36BCF7" stop-opacity=".35"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/></radialGradient>
  <radialGradient id="nbOrbB"><stop offset="0" stop-color="#A78BFA" stop-opacity=".28"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <linearGradient id="nbName" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
    <stop offset="0" stop-color="#E6EDF3"/><stop offset=".45" stop-color="#E6EDF3"/><stop offset=".5" stop-color="#36BCF7"/><stop offset=".55" stop-color="#E6EDF3"/><stop offset="1" stop-color="#E6EDF3"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-700 0;900 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="nbScan" x1="0" x2="1"><stop offset="0" stop-color="#36BCF7" stop-opacity="0"/><stop offset=".5" stop-color="#36BCF7" stop-opacity=".08"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/></linearGradient>
  <clipPath id="nbClip"><rect width="1280" height="340" rx="18"/></clipPath>
</defs>
<g clip-path="url(#nbClip)">
<rect width="1280" height="340" fill="url(#nbBg)"/>
