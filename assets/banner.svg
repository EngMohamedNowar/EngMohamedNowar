e class="pt" style="animation-duration:13.3s;animation-delay:-7.0s" cx="527" cy="223" r="2"/><circle class="pt" style="animation-duration:10.4s;animation-delay:-12.4s" cx="360" cy="249" r="2"/><circle class="pt" style="animation-duration:11.7s;animation-delay:-13.8s" cx="901" cy="301" r="1.6"/><circle class="pt" style="animation-duration:6.7s;animation-delay:-2.1s" cx="799" cy="138" r="1.2"/><circle class="pt" style="animation-duration:12.6s;animation-delay:-2.6s" cx="497" cy="26" r="2"/><circle class="pt" style="animation-duration:9.4s;animation-delay:-5.2s" cx="597" cy="22" r="1.2"/></g>
