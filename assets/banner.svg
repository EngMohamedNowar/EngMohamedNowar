  <g transform="translate(22 0)"><text class="r r0" style="animation-delay:0s" x="70" y="232">ASP.NET Core Web APIs</text><text class="r r1" style="animation-delay:3s" x="70" y="232">Clean Architecture &amp; CQRS</text><text class="r r2" style="animation-delay:6s" x="70" y="232">EF Core · SQL Server · Redis</text><text class="r r3" style="animation-delay:9s" x="70" y="232">JWT Auth · Stripe · Docker</text></g>
