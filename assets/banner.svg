  <text class="t" style="animation-delay:.1s" x="70" y="104" font-size="18" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Hi there, I'm</text>
  <text class="t" style="animation-delay:.25s" x="68" y="164" font-size="60" font-weight="800" letter-spacing="1" fill="url(#nbName)">Mohamed Nowar</text>
