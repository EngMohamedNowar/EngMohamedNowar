<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" preserveAspectRatio="none">
<style>
  .w1{animation:wv 9s linear infinite} .w2{animation:wv 14s linear infinite reverse} .w3{animation:wv 20s linear infinite}
  .tx{animation:up 1s .3s ease-out both}
  @keyframes wv{to{transform:translateX(-1280px)}}
