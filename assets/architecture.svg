<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B949E"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="518" rx="16" fill="#0D1117" stroke="#30363D"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#E6EDF3">Clean Architecture - Request Flow</text>

  <!-- Clients -->
  <rect x="50" y="70" width="400" height="60" rx="12" fill="#161B22" stroke="#8B949E"/>
  <text x="250" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#E6EDF3">Clients</text>
  <text x="250" y="116" text-anchor="middle" font-size="12" fill="#8B949E">Web  •  Mobile  •  Swagger  •  Postman</text>

  <!-- API -->
  <rect x="50" y="165" width="400" height="80" rx="12" fill="#161B22" stroke="#36BCF7" stroke-width="2"/>
  <text x="250" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#36BCF7">API Layer</text>
  <text x="250" y="220" text-anchor="middle" font-size="12" fill="#8B949E">Controllers  •  Middleware  •  JWT Auth</text>

  <!-- Application -->
  <rect x="50" y="280" width="400" height="80" rx="12" fill="#161B22" stroke="#7C3AED" stroke-width="2"/>
  <text x="250" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#A78BFA">Application Layer</text>
  <text x="250" y="335" text-anchor="middle" font-size="12" fill="#8B949E">Services  •  DTOs  •  Interfaces  •  AutoMapper</text>

  <!-- Domain -->
  <rect x="50" y="395" width="400" height="80" rx="12" fill="#161B22" stroke="#22C55E" stroke-width="2"/>
  <text x="250" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#4ADE80">Domain Layer</text>
  <text x="250" y="450" text-anchor="middle" font-size="12" fill="#8B949E">Entities  •  Specifications  •  Business Rules</text>

  <!-- Vertical arrows -->
  <line x1="250" y1="130" x2="250" y2="163" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="245" x2="250" y2="278" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="360" x2="250" y2="393" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Infrastructure -->
  <rect x="520" y="280" width="330" height="80" rx="12" fill="#161B22" stroke="#F59E0B" stroke-width="2"/>
  <text x="685" y="313" text-anchor="middle" font-size="16" font-weight="700" fill="#FBBF24">Infrastructure Layer</text>
  <text x="685" y="335" text-anchor="middle" font-size="12" fill="#8B949E">EF Core  •  Repositories  •  Unit of Work</text>

  <!-- Infrastructure implements Application -->
  <line x1="518" y1="320" x2="452" y2="320" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="311" text-anchor="middle" font-size="11" fill="#8B949E">implements</text>

  <!-- DI registration -->
  <path d="M452 205 H685 V278" fill="none" stroke="#36BCF7" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="570" y="196" text-anchor="middle" font-size="11" fill="#8B949E">DI registration</text>

  <!-- Infrastructure to external services -->
  <line x1="685" y1="360" x2="685" y2="385" stroke="#8B949E" stroke-width="2"/>
  <line x1="578" y1="385" x2="792" y2="385" stroke="#8B949E" stroke-width="2"/>
  <line x1="578" y1="385" x2="578" y2="403" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="385" x2="685" y2="403" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="792" y1="385" x2="792" y2="403" stroke="#8B949E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="405" width="116" height="70" rx="12" fill="#161B22" stroke="#CC2927" stroke-width="2"/>
  <text x="578" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#F87171">SQL Server</text>
  <text x="578" y="456" text-anchor="middle" font-size="11" fill="#8B949E">Database</text>

  <rect x="627" y="405" width="116" height="70" rx="12" fill="#161B22" stroke="#FF4438" stroke-width="2"/>
  <text x="685" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#FB7185">Redis</text>
  <text x="685" y="456" text-anchor="middle" font-size="11" fill="#8B949E">Caching</text>

  <rect x="734" y="405" width="116" height="70" rx="12" fill="#161B22" stroke="#0078D4" stroke-width="2"/>
  <text x="792" y="436" text-anchor="middle" font-size="14" font-weight="700" fill="#38BDF8">Azure</text>
  <text x="792" y="456" text-anchor="middle" font-size="11" fill="#8B949E">Cloud Hosting</text>
</svg>
