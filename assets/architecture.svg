<svg viewBox="0 0 900 520" width="900" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style>
  .bx{animation:up .7s cubic-bezier(.2,.7,.2,1) both}
  .pulse{stroke-opacity:0;animation:pl 3.6s ease-in-out infinite}
  .fl path{stroke-dasharray:5 6;animation:flow 1s linear infinite}
  .ttl{animation:up .7s ease-out both}
  .grid{animation:gm 20s linear infinite}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pl{0%,100%{stroke-opacity:0;stroke-width:2}20%{stroke-opacity:.9;stroke-width:6}40%{stroke-opacity:0;stroke-width:10}}
  @keyframes flow{to{stroke-dashoffset:-22}}
  @keyframes gm{to{transform:translateY(30px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
