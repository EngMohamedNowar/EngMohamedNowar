<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<title>linkedin</title>
<style>
.tile{animation:tile 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes tile{0%,20%,100%{stroke-opacity:.45}9%{stroke-opacity:1}}
.m-bob,.m-lift{animation:bob 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes bob{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(-2.5px)}}
.m-swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes swing{0%,22%,100%{transform:rotate(0)}6%{transform:rotate(-12deg)}13%{transform:rotate(9deg)}18%{transform:rotate(-3deg)}}
.m-fly{animation:fly 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes fly{0%,20%,100%{transform:translate(0,0)}10%{transform:translate(3px,-3px)}}
.m-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes pulse{0%,20%,100%{transform:scale(1)}10%{transform:scale(1.14)}}
.m-tilt{transform-box:fill-box;transform-origin:center;animation:tilt 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes tilt{0%,20%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}}
.m-roll{animation:roll 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes roll{0%,20%,100%{transform:translateX(0)}10%{transform:translateX(3px)}}
.m-print{animation:print 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes print{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(2.5px)}}
.m-rise{animation:rise 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes rise{0%,20%,100%{transform:translateY(0)}10%{transform:translateY(-3px)}}
.m-scan{animation:scan 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes scan{0%,24%,100%{transform:translateY(0)}12%{transform:translateY(7px)}}
.m-flow{stroke-dasharray:3 3;animation:mflow 1.4s linear infinite;animation-delay:0.55s}
@keyframes mflow{to{stroke-dashoffset:-12}}
.m-bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 7s ease-in-out infinite;animation-delay:0.55s}
.b2{animation-delay:0.70s}.b3{animation-delay:0.85s}
@keyframes bar{0%,22%,100%{transform:scaleY(1)}10%{transform:scaleY(.5)}}
.m-clap{transform-box:fill-box;transform-origin:0 100%;animation:clap 7s ease-in-out infinite;animation-delay:0.55s}
.m-spin{transform-box:fill-box;transform-origin:center;animation:spin 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes spin{0%,24%,100%{transform:scaleX(1)}6%{transform:scaleX(.2)}12%{transform:scaleX(-1)}18%{transform:scaleX(.3)}}
.m-flap{transform-box:fill-box;transform-origin:50% 0;animation:flap 7s ease-in-out infinite;animation-delay:0.55s}
@keyframes flap{0%,22%,100%{transform:scaleY(1)}10%{transform:scaleY(-.6)}}
@keyframes clap{0%,20%,100%{transform:rotate(0)}8%{transform:rotate(-14deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#A78BFA"/></linearGradient></defs>
<rect x="1" y="1" width="46" height="46" rx="13" fill="#36BCF7" fill-opacity=".12"/>
<rect class="tile" x="1.5" y="1.5" width="45" height="45" rx="12.5" fill="none" stroke="url(#t)" stroke-width="1.6"/>
<g transform="translate(12 12)" fill="none" stroke="#36BCF7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><g class="m-pulse"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="#36BCF7" stroke="none"/></g></g>
</svg>
