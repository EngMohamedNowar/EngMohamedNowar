  .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
  @keyframes edge{to{stroke-dashoffset:-100}}
  @keyframes in{from{transform:translateY(12px)}to{transform:none}}
  .seg,.fillbar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.shine{animation:shine 3.5s ease-in-out infinite}@keyframes shine{0%{opacity:1;transform:translateX(0)}60%,100%{opacity:1;transform:translateX(calc(var(--w) + 40px))}}@media (prefers-reduced-motion: reduce){.seg,.fillbar{transform:none}}
