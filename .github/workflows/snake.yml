name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # يشتغل كل يوم الساعة 12 بالليل UTC
  workflow_dispatch:      # يسمحلك تشغّله يدوي من تبويب Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: EngMohamedNowar
          outputs: |
            dist/github-snake.svg?color_snake=#20AACF&color_dots=#EEE6F5,#D9C2E8,#B57FCB,#9A55B5,#804199
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#20AACF&color_dots=#1A1233,#3B2152,#5E2F7C,#804199,#B57FCB

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
